name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build-cli:
    name: CLI – ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
            suffix: linux-x64
          - goos: linux
            goarch: arm64
            suffix: linux-arm64
          - goos: darwin
            goarch: amd64
            suffix: macos-x64
          - goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - goos: windows
            goarch: amd64
            suffix: windows-x64
            ext: .exe
          - goos: windows
            goarch: arm64
            suffix: windows-arm64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Build CLI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o cpc-image-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/cpc-image/

      - uses: actions/upload-artifact@v4
        with:
          name: cpc-image-${{ matrix.suffix }}
          path: cpc-image-${{ matrix.suffix }}${{ matrix.ext }}

  build-gui:
    name: GUI – ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    strategy:
      matrix:
        include:
          - name: macos-arm64
            runner: macos-14
            goos: darwin
            goarch: arm64
            suffix: macos-arm64
          - name: macos-x64
            runner: macos-13
            goos: darwin
            goarch: amd64
            suffix: macos-x64
          - name: linux-x64
            runner: ubuntu-latest
            goos: linux
            goarch: amd64
            suffix: linux-x64
          - name: windows-x64
            runner: windows-latest
            goos: windows
            goarch: amd64
            suffix: windows-x64
            ext: .exe
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"

      - name: Install Linux dependencies
        if: matrix.goos == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgl1-mesa-dev \
            libx11-dev \
            libxcursor-dev \
            libxrandr-dev \
            libxinerama-dev \
            libxi-dev \
            libxxf86vm-dev

      - name: Build GUI
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "1"
        run: |
          go build -trimpath -ldflags="-s -w" \
            -o cpc-image-gui-${{ matrix.suffix }}${{ matrix.ext }} \
            ./cmd/cpc-image-gui/

      - uses: actions/upload-artifact@v4
        with:
          name: cpc-image-gui-${{ matrix.suffix }}
          path: cpc-image-gui-${{ matrix.suffix }}${{ matrix.ext }}

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.21"
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1-mesa-dev libx11-dev libxcursor-dev libxrandr-dev libxinerama-dev libxi-dev libxxf86vm-dev
      - name: Test
        run: go test -cover ./...

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-cli, build-gui, test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          generate_release_notes: true
